<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>RC Músicas</title>
<style>
:root{--bg:#0a0a0a;--card:#141414;--line:#2a2a2a;--red:#e50914;--glow:rgba(229,9,20,.35);--text:#f2f2f2;--dim:#9a9a9a;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text);
  background:radial-gradient(900px 380px at 50% -140px,rgba(229,9,20,.18),transparent),var(--bg)}
body.has-player main{padding-bottom:170px}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}

header{position:sticky;top:0;z-index:10;background:rgba(10,10,10,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  padding:calc(14px + env(safe-area-inset-top,0px)) 0 10px;border-bottom:1px solid rgba(255,255,255,.04)}
.logo-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.logo{width:36px;height:36px;border-radius:50%;background:#000;border:2px solid var(--red);color:var(--red);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;box-shadow:0 0 16px var(--glow)}
h1{font-size:18px;margin:0;letter-spacing:.6px}
h1 span{color:var(--red)}
.search{width:100%;background:var(--card);border:1px solid var(--line);border-radius:30px;padding:11px 18px;color:var(--text);
  font:inherit;font-size:14px;outline:none;margin-bottom:10px;transition:border-color .15s,box-shadow .15s}
.search:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(229,9,20,.15)}
.search::placeholder{color:var(--dim)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:8px 16px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--dim);
  font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;transition:.15s}
.tab:hover{color:var(--text)}
.tab.active{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 4px 14px var(--glow)}

main{padding:16px 0 32px}
.status{text-align:center;color:var(--dim);padding:48px 0;font-size:14px}
.section-title{font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin:0 0 12px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;position:relative;
  transition:border-color .15s,transform .15s,box-shadow .15s}
.card:hover{border-color:var(--red);transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.5)}
.card.playing{border-color:var(--red);box-shadow:0 0 0 1px var(--red),0 0 20px var(--glow)}
.cover{height:112px;position:relative;display:flex;align-items:center;justify-content:center}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(0,0,0,.45))}
.initials{font-size:28px;font-weight:800;letter-spacing:1px;color:rgba(255,255,255,.93);text-shadow:0 2px 6px rgba(0,0,0,.35);z-index:1}
.badge{position:absolute;right:8px;bottom:8px;z-index:2;width:30px;height:30px;border-radius:50%;background:var(--red);color:#fff;
  display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.badge svg{width:14px;height:14px}
.card-body{padding:10px 12px 13px}
.card-name{font-size:13px;font-weight:700;min-height:32px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-sub{font-size:11px;color:var(--dim);margin-top:3px}

/* ---- Lista de músicas do cantor ---- */
#songsView{display:none}
body.songs #songsView{display:block}
body.songs #searchWrap,body.songs #tabs,body.songs #grid,body.songs #status{display:none!important}
.back{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:20px;padding:8px 14px;font:inherit;
  font-size:13px;font-weight:700;cursor:pointer;margin-bottom:16px}
.back:hover{border-color:var(--red);color:var(--red)}
.artist-head{display:flex;align-items:center;gap:16px;margin-bottom:20px}
.artist-cover{width:84px;height:84px;border-radius:18px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  font-size:28px;font-weight:800;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.artist-name{font-size:22px;font-weight:800;line-height:1.15;overflow-wrap:anywhere}
.artist-sub{font-size:13px;color:var(--dim);margin:4px 0 10px}
.play-all{background:var(--red);color:#fff;border:0;border-radius:24px;padding:9px 20px;font:inherit;font-size:13px;font-weight:700;
  cursor:pointer;box-shadow:0 4px 14px var(--glow);display:inline-flex;align-items:center;gap:8px;transition:transform .15s}
.play-all svg{width:14px;height:14px}
.play-all:active{transform:scale(.96)}
.song{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:border-color .15s,background .15s}
.song:hover{border-color:var(--red)}
.song.playing{border-color:var(--red);background:#1a0a0c}
.song-num{width:22px;text-align:center;font-size:12px;font-weight:700;color:var(--dim);flex:0 0 auto}
.song.playing .song-num{display:none}
.eq{display:none;width:22px;height:14px;align-items:flex-end;justify-content:center;gap:2px;flex:0 0 auto}
.song.playing .eq{display:flex}
.eq i{width:3px;background:var(--red);border-radius:2px;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.25s}.eq i:nth-child(3){animation-delay:.5s}
@keyframes eq{0%,100%{height:3px}50%{height:14px}}
.song-name{flex:1;font-size:14px;font-weight:600;overflow-wrap:anywhere}
.song-play{width:32px;height:32px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;
  flex:0 0 auto;transition:transform .15s}
.song-play svg{width:13px;height:13px}
.song:hover .song-play{transform:scale(1.08)}

/* ---- Player fixo ---- */
.player{position:fixed;left:0;right:0;bottom:0;z-index:50;display:none;background:linear-gradient(180deg,#171717,#0a0a0a);
  border-top:1px solid var(--line);box-shadow:0 -8px 28px rgba(0,0,0,.6);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px))}
.player.open{display:block}
.p-top{display:flex;align-items:center;gap:12px}
.p-cover{width:44px;height:44px;border-radius:10px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff}
.p-info{flex:1;min-width:0}
.p-title,.p-artist{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-title{font-size:13px;font-weight:700}
.p-artist{font-size:11px;color:var(--dim);margin-top:2px}
.p-ctrl{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:2px}
.p-ctrl button,.p-top .close{background:none;border:0;color:var(--text);cursor:pointer;width:44px;height:44px;border-radius:50%;padding:0;
  display:flex;align-items:center;justify-content:center;transition:background .15s,transform .15s,color .15s}
.p-ctrl button svg{width:24px;height:24px;display:block}
.p-ctrl button:hover,.p-top .close:hover{background:rgba(255,255,255,.08)}
.p-ctrl button:active,.p-top .close:active{transform:scale(.92)}
.p-ctrl .skip{color:var(--dim)}
.p-ctrl .skip:hover{color:var(--text)}
.p-ctrl .skip svg{width:28px;height:28px}
.p-ctrl .play{width:54px;height:54px;background:var(--red);color:#fff;box-shadow:0 4px 16px var(--glow)}
.p-ctrl .play:hover{background:#ff1a26}
.p-ctrl .play svg{width:26px;height:26px}
.p-top .close{width:32px;height:32px;color:var(--dim);flex:0 0 auto}
.p-top .close svg{width:14px;height:14px}
.p-top .close:hover{color:var(--red);background:none}
.p-prog{display:flex;align-items:center;gap:10px;margin-top:8px}
.p-time{font-size:10px;color:var(--dim);width:34px;text-align:center;flex:0 0 auto}
.track{flex:1;height:14px;display:flex;align-items:center;cursor:pointer}
.track div{width:100%;height:4px;border-radius:4px;background:var(--line);position:relative}
.fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--red);border-radius:4px}
.fill::after{content:"";position:absolute;right:-6px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px var(--glow)}

@media (min-width:700px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:18px}
  .cover{height:132px}
  .artist-cover{width:110px;height:110px;font-size:34px}
  .artist-name{font-size:30px}
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="logo-row"><div class="logo">RC</div><h1>RC <span>MÚSICAS</span></h1></div>
    <div id="searchWrap"><input class="search" id="search" type="search" placeholder="Buscar cantor..." autocomplete="off"></div>
    <div class="tabs" id="tabs"></div>
  </div>
</header>

<main class="wrap">
  <div id="status" class="status">Carregando músicas...</div>
  <div id="grid" class="grid"></div>

  <div id="songsView">
    <button class="back" id="backBtn">&larr; Voltar</button>
    <div class="artist-head">
      <div class="artist-cover" id="sCover"></div>
      <div>
        <div class="artist-name" id="sTitle"></div>
        <div class="artist-sub" id="sSub"></div>
        <button class="play-all" id="playAll"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.9v14.2a1 1 0 0 0 1.5.86l11.5-7.1a1 1 0 0 0 0-1.72L8.5 4.04A1 1 0 0 0 7 4.9z"/></svg>Tocar tudo</button>
      </div>
    </div>
    <p class="section-title">Músicas</p>
    <div id="songsList"></div>
  </div>
</main>

<div class="player" id="player">
  <div class="wrap">
    <div class="p-top">
      <div class="p-cover" id="pCover"></div>
      <div class="p-info"><div class="p-title" id="pTitle"></div><div class="p-artist" id="pArtist"></div></div>
      <button class="close" id="bClose" title="Fechar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="p-prog">
      <span class="p-time" id="tAtual">0:00</span>
      <div class="track" id="track"><div><div class="fill" id="fill"></div></div></div>
      <span class="p-time" id="tTotal">0:00</span>
    </div>
    <div class="p-ctrl">
      <button class="skip" id="bBack" title="Voltar 10 segundos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M6.6 3v3.8h3.8"/><text x="12" y="15.3" font-size="7.5" font-weight="700" text-anchor="middle" fill="currentColor" stroke="none" font-family="Arial,sans-serif">10</text></svg></button>
      <button id="bPrev" title="Anterior"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="2.4" height="14" rx="1.2"/><path d="M19 6.2v11.6a1 1 0 0 1-1.6.8l-8-5.8a1 1 0 0 1 0-1.6l8-5.8a1 1 0 0 1 1.6.8z"/></svg></button>
      <button class="play" id="bPlay" title="Tocar/Pausar"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.9v14.2a1 1 0 0 0 1.5.86l11.5-7.1a1 1 0 0 0 0-1.72L8.5 4.04A1 1 0 0 0 7 4.9z"/></svg></button>
      <button id="bNext" title="Próxima"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="16.6" y="5" width="2.4" height="14" rx="1.2"/><path d="M5 6.2v11.6a1 1 0 0 0 1.6.8l8-5.8a1 1 0 0 0 0-1.6l-8-5.8A1 1 0 0 0 5 6.2z"/></svg></button>
      <button class="skip" id="bFwd" title="Avançar 10 segundos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M17.4 3v3.8h-3.8"/><text x="12" y="15.3" font-size="7.5" font-weight="700" text-anchor="middle" fill="currentColor" stroke="none" font-family="Arial,sans-serif">10</text></svg></button>
    </div>
  </div>
  <audio id="audio" preload="none"></audio>
</div>

<script src="https://cdn.jsdelivr.net/npm/firebase@10.13.2/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.13.2/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.13.2/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyDO4KqdFDwEdOXEYBKbLEGPy3V4toVJQPw",
  authDomain: "teste-27848.firebaseapp.com",
  databaseURL: "https://teste-27848-default-rtdb.firebaseio.com",
  projectId: "teste-27848",
  storageBucket: "teste-27848.firebasestorage.app",
  messagingSenderId: "392938631634",
  appId: "1:392938631634:android:df1450fce0fdd45dbb180b"
});

var IC_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.9v14.2a1 1 0 0 0 1.5.86l11.5-7.1a1 1 0 0 0 0-1.72L8.5 4.04A1 1 0 0 0 7 4.9z"/></svg>', IC_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.3"/><rect x="14" y="5" width="4" height="14" rx="1.3"/></svg>';
var $ = function (id) { return document.getElementById(id); };
var statusEl = $('status'), tabsEl = $('tabs'), gridEl = $('grid'), searchEl = $('search');
var songsList = $('songsList'), audio = $('audio'), playerEl = $('player');

var generos = {}, listaAtual = [];
var cantorAberto = null, cantorTocando = null, indice = -1, pushed = false;

/* ---------- Firebase ---------- */
firebase.auth().signInAnonymously().then(carregar).catch(function (e) {
  // As regras do banco estão públicas (.read: true), então tenta carregar
  // mesmo se o login anônimo falhar (ex.: provedor Anônimo desativado no console).
  carregar();
});

function carregar() {
  firebase.database().ref('conteudo/musicas').once('value').then(function (snapGeneros) {
    generos = {};
    snapGeneros.forEach(function (gSnap) {
      var cantores = [];
      gSnap.forEach(function (cSnap) {
        var nome = cSnap.child('_nome').val();
        if (!nome || !String(nome).trim()) nome = cSnap.key;

        var musicas = [];
        cSnap.forEach(function (mSnap) {
          if (mSnap.key === '_nome') return;
          var v = mSnap.val();
          if (typeof v === 'string') {                 // novo: "Nome da música": "link"
            musicas.push({ nome: mSnap.key, url: v });
          } else if (v && typeof v === 'object') {     // antigo: { nome, url }
            musicas.push({ nome: v.nome || mSnap.key, url: v.url || '' });
          }
        });
        if (musicas.length) cantores.push({ nome: nome, genero: gSnap.key, musicas: musicas });
      });
      generos[gSnap.key] = cantores;
    });

    var nomes = Object.keys(generos);
    if (!nomes.length) { statusEl.textContent = 'Nenhuma música cadastrada ainda.'; return; }
    montarAbas(nomes);
    selecionarGenero('__TODOS__');
  }).catch(function (e) {
    statusEl.textContent = 'Erro ao carregar músicas: ' + e.message;
  });
}

/* ---------- Utilidades ---------- */
var paletas = [['#e50914','#8a0a0a'],['#7b1fa2','#4a0e63'],['#1565c0','#0d3a75'],['#00838f','#0a4a50'],
               ['#ef6c00','#8a3d00'],['#2e7d32','#154018'],['#ad1457','#5e0a30'],['#5d4037','#2e1f1a']];
function grad(nome) {
  var h = 0;
  for (var i = 0; i < nome.length; i++) h = nome.charCodeAt(i) + ((h << 5) - h);
  var p = paletas[Math.abs(h) % paletas.length];
  return 'linear-gradient(135deg,' + p[0] + ',' + p[1] + ')';
}
function curto(nome) { return String(nome).replace(/\s*[\r\n]+\s*/g, ' ').trim(); }
function iniciais(nome) {
  return curto(nome).split(/\s+/).slice(0, 2).map(function (p) { return p[0]; }).join('').toUpperCase() || '?';
}
function plural(n) { return n + (n === 1 ? ' música' : ' músicas'); }
function resolverUrl(u) {
  if (!/drive\.(usercontent\.)?google\.com/.test(u)) return u;
  var m = u.match(/\/d\/([^\/?&#]+)/) || u.match(/[?&]id=([^&#]+)/);
  return m ? 'https://drive.usercontent.google.com/download?id=' + m[1] + '&export=download&confirm=t' : u;
}
function tempo(s) {
  if (!isFinite(s) || s < 0) s = 0;
  var sec = Math.floor(s % 60);
  return Math.floor(s / 60) + ':' + (sec < 10 ? '0' : '') + sec;
}

/* ---------- Categorias e cantores ---------- */
function montarAbas(nomes) {
  tabsEl.innerHTML = '';
  ['__TODOS__'].concat(nomes).forEach(function (n) {
    var t = document.createElement('div');
    t.className = 'tab';
    t.dataset.genero = n;
    t.textContent = n === '__TODOS__' ? 'TODOS' : n;
    t.onclick = function () { selecionarGenero(n); };
    tabsEl.appendChild(t);
  });
}

function selecionarGenero(n) {
  Array.prototype.forEach.call(tabsEl.children, function (t) {
    t.classList.toggle('active', t.dataset.genero === n);
  });
  listaAtual = n === '__TODOS__'
    ? Object.keys(generos).reduce(function (a, k) { return a.concat(generos[k]); }, [])
    : (generos[n] || []);
  aplicarBusca();
}

function aplicarBusca() {
  var q = searchEl.value.trim().toLowerCase();
  renderGrid(q ? listaAtual.filter(function (c) { return curto(c.nome).toLowerCase().indexOf(q) > -1; }) : listaAtual);
}
searchEl.addEventListener('input', aplicarBusca);

function renderGrid(lista) {
  gridEl.innerHTML = '';
  if (!lista.length) {
    statusEl.style.display = 'block';
    statusEl.textContent = 'Nenhum cantor encontrado.';
    return;
  }
  statusEl.style.display = 'none';

  lista.forEach(function (c) {
    var card = document.createElement('div');
    card.className = 'card';
    card._c = c;

    var cover = document.createElement('div');
    cover.className = 'cover';
    cover.style.background = grad(c.nome);
    cover.innerHTML = '<div class="initials"></div><div class="badge">' + IC_PLAY + '</div>';
    cover.firstChild.textContent = iniciais(c.nome);

    var body = document.createElement('div');
    body.className = 'card-body';
    body.innerHTML = '<div class="card-name"></div><div class="card-sub"></div>';
    body.firstChild.textContent = curto(c.nome);
    body.lastChild.textContent = plural(c.musicas.length);

    card.appendChild(cover);
    card.appendChild(body);
    card.onclick = function () { abrirCantor(c); };
    gridEl.appendChild(card);
  });
  marcarTocando();
}

/* ---------- Lista de músicas do cantor ---------- */
function abrirCantor(c) {
  cantorAberto = c;
  $('sCover').style.background = grad(c.nome);
  $('sCover').textContent = iniciais(c.nome);
  $('sTitle').textContent = curto(c.nome);
  $('sSub').textContent = c.genero + ' • ' + plural(c.musicas.length);

  songsList.innerHTML = '';
  c.musicas.forEach(function (m, i) {
    var row = document.createElement('div');
    row.className = 'song';
    row.innerHTML = '<div class="song-num"></div><div class="eq"><i></i><i></i><i></i></div>' +
                    '<div class="song-name"></div><div class="song-play">' + IC_PLAY + '</div>';
    row.children[0].textContent = i + 1;
    row.children[2].textContent = curto(m.nome);
    row.onclick = function () { tocar(c, i); };
    songsList.appendChild(row);
  });

  document.body.classList.add('songs');
  if (!pushed) { history.pushState({ v: 1 }, ''); pushed = true; }
  window.scrollTo(0, 0);
  marcarTocando();
}

function voltar() {
  document.body.classList.remove('songs');
  pushed = false;
  aplicarBusca();
}
$('backBtn').onclick = function () { pushed ? history.back() : voltar(); };
window.addEventListener('popstate', function () {
  if (document.body.classList.contains('songs')) voltar();
});
$('playAll').onclick = function () { if (cantorAberto) tocar(cantorAberto, 0); };

function marcarTocando() {
  Array.prototype.forEach.call(gridEl.children, function (card) {
    card.classList.toggle('playing', card._c === cantorTocando);
  });
  Array.prototype.forEach.call(songsList.children, function (row, i) {
    row.classList.toggle('playing', cantorAberto === cantorTocando && i === indice);
  });
}

/* ---------- Player ---------- */
function tocar(c, i) {
  if (!c || i < 0 || i >= c.musicas.length) return;
  var m = c.musicas[i];
  if (!m.url) { alert('Esta música não tem link cadastrado.'); return; }

  cantorTocando = c; indice = i;
  marcarTocando();
  var url = resolverUrl(m.url);

  // Dentro do app: abre a PlayerActivity nativa pelo WebView
  if (window.Android && typeof window.Android.abrirMusica === 'function') {
    window.Android.abrirMusica(url, 'musica_' + (m.nome || c.nome));
    return;
  }

  // No navegador: toca na barra fixa
  $('pCover').style.background = grad(c.nome);
  $('pCover').textContent = iniciais(c.nome);
  $('pTitle').textContent = curto(m.nome);
  $('pArtist').textContent = curto(c.nome);
  playerEl.classList.add('open');
  document.body.classList.add('has-player');
  audio.src = url;
  audio.play().catch(function () {});
}

function passo(d) {
  if (!cantorTocando) return;
  var n = cantorTocando.musicas.length;
  tocar(cantorTocando, (indice + d + n) % n);
}
$('bPrev').onclick = function () { passo(-1); };
$('bNext').onclick = function () { passo(1); };
function pular(seg) {
  if (!audio.getAttribute('src')) return;
  var t = audio.currentTime + seg;
  if (isFinite(audio.duration)) t = Math.min(t, audio.duration);
  audio.currentTime = Math.max(0, t);
}
$('bBack').onclick = function () { pular(-10); };
$('bFwd').onclick = function () { pular(10); };
$('bPlay').onclick = function () { audio.paused ? audio.play().catch(function () {}) : audio.pause(); };
$('bClose').onclick = function () {
  audio.pause(); audio.removeAttribute('src'); audio.load();
  playerEl.classList.remove('open');
  document.body.classList.remove('has-player');
  cantorTocando = null; indice = -1;
  marcarTocando();
};

audio.addEventListener('play', function () { $('bPlay').innerHTML = IC_PAUSE; });
audio.addEventListener('pause', function () { $('bPlay').innerHTML = IC_PLAY; });
audio.addEventListener('ended', function () { passo(1); });
audio.addEventListener('error', function () {
  if (audio.getAttribute('src')) $('pArtist').textContent = 'Não foi possível carregar esta música';
});
audio.addEventListener('loadedmetadata', function () { $('tTotal').textContent = tempo(audio.duration); });
audio.addEventListener('timeupdate', function () {
  $('tAtual').textContent = tempo(audio.currentTime);
  $('fill').style.width = (audio.duration ? audio.currentTime / audio.duration * 100 : 0) + '%';
});
$('track').addEventListener('click', function (e) {
  if (!audio.duration) return;
  var r = this.getBoundingClientRect();
  audio.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * audio.duration;
});
</script>
</body>
</html>
